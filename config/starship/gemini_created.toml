"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold fg:maroon)\
[](fg:maroon)\
$os\
[](bg:surface0 fg:maroon)\
$username\
[](bg:peach fg:surface0)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow)\
$fill\
$python$nodejs$bun$deno$rust$golang$java$kotlin$scala$c$cpp$dotnet$ruby$php$lua$perl$elixir$erlang$haskell$ocaml$nim$zig$swift$dart$julia$rlang$vlang$gleam$crystal$solidity$elm$purescript$raku$red$fennel$odin$mojo\
$cmd_duration\
$time\
\n[╰─ ](bold fg:maroon)$character"""

right_format = """"""

palette = 'catppuccin_latte'

[os]
disabled = false
style = "bg:maroon fg:crust"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
NixOS = " "

[fill]
symbol = '─'
style = 'bold surface0'

[username]
show_always = true
style_user = "bg:surface0 fg:red"
style_root = "bg:surface0 fg:red"
format = '[ [󰣐 $user ](bold fg:red bg:surface0)]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ [󰉋](fg:crust bg:peach) $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = '~'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:lang_javascript fg:crust bold"
format = '[[ ](fg:lang_javascript)[ $symbol( $version) ](fg:crust bg:lang_javascript)[](fg:lang_javascript)]($style)'

[bun]
symbol = ""
style = "bg:lang_bun fg:text bold"
format = '[[ ](fg:lang_bun)[ $symbol( $version) ](fg:text bg:lang_bun)[](fg:lang_bun)]($style)'

[deno]
symbol = ""
style = "bg:lang_deno fg:crust bold"
format = '[[ ](fg:lang_deno)[ $symbol( $version) ](fg:crust bg:lang_deno)[](fg:lang_deno)]($style)'

[python]
symbol = ""
style = "bg:lang_python fg:crust bold"
format = '[[ ](fg:lang_python)[ $symbol( $version)(\($virtualenv\)) ](fg:crust bg:lang_python)[](fg:lang_python)]($style)'

[rust]
symbol = ""
style = "bg:lang_rust fg:crust bold"
format = '[[ ](fg:lang_rust)[ $symbol( $version) ](fg:crust bg:lang_rust)[](fg:lang_rust)]($style)'

[golang]
symbol = ""
style = "bg:lang_go fg:crust bold"
format = '[[ ](fg:lang_go)[ $symbol( $version) ](fg:crust bg:lang_go)[](fg:lang_go)]($style)'

