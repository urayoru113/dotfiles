format = '[[ ](fg:sapphire)[ $symbol( $context) ](fg:crust bg:sapphire)[](fg:sapphire)]($style)'

[conda]
symbol = ""
style = "fg:crust bg:sapphire"
format = '[[ ](fg:sapphire)[ $symbol $environment ](fg:crust bg:sapphire)[](fg:sapphire)]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:teal"
format = '[[ ](fg:teal)[  $time ](fg:crust bg:teal)[](fg:teal)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[✗ ❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:teal)'
vimcmd_replace_one_symbol = '[󰰟](bold fg:lavender)'
vimcmd_replace_symbol = '[󰬙](bold fg:maroon)'
vimcmd_visual_symbol = '[󰰫](bold fg:base)'

[cmd_duration]
show_milliseconds = true
format = '[[ ](fg:lavender)[  in $duration ](fg:crust bg:lavender)[](fg:lavender)]($style)'
style = "bg:lavender"
disabled = false
show_notifications = false
min_time_to_notify = 45000
min_time = 1000

